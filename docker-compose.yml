services:
  redis:
    image: redis:7-alpine
    container_name: moyeolak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring

  postgres:
    image: postgis/postgis:15-3.3
    container_name: moyeolak-postgres
    environment:
      POSTGRES_DB: moyeolak
      POSTGRES_USER: moyeolak
      POSTGRES_PASSWORD: moyeolak
      TZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "psql -U moyeolak -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='moyeolak'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgis/postgis:15-3.3
    container_name: moyeolak-postgres-init
    depends_on:
      - postgres
    environment:
      PGPASSWORD: moyeolak
    command:
      - sh
      - -c
      - |
        until pg_isready -h postgres -U moyeolak -d postgres; do
          sleep 1
        done
        psql -h postgres -U moyeolak -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='moyeolak'" | grep -q 1 \
          || psql -h postgres -U moyeolak -d postgres -c "CREATE DATABASE moyeolak"
    networks:
      - monitoring
    restart: "no"

  # Prometheus - 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # Loki - 로그 저장소
  loki:
    image: grafana/loki:latest
    container_name: loki
    profiles:
      - monitoring
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana - 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================
  # Node Exporter - 서버 메트릭 수집 (profiles: prod)
  # Linux 서버 전용 - macOS에서는 동작하지 않음
  # ============================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles:
      - prod
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  redis_data:
  pgdata:
  prometheus-data:
  loki-data:
  grafana-data:
