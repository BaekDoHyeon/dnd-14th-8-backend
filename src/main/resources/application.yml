spring:
  application:
    name: moyeolak
  profiles:
    active: local
  threads:
    virtual:
      enabled: true

# 관리자 통계 대시보드 공유 토큰. 미설정 시 /api/admin/** 는 잠긴다(기본 안전).
admin:
  token: ${ADMIN_TOKEN:}

# 외부 API 호출 통계 (관리자 대시보드)
external-api:
  metrics:
    snapshot-interval-ms: 300000      # 스냅샷 적재 주기 5분
    snapshot-initial-delay-ms: 0
    retention-days: 30                # 스냅샷 보관 기간
    cleanup-cron: "0 30 4 * * *"      # 매일 04:30 오래된 스냅샷 정리
  stats:
    # 일일 한도 (2026-07 기준 조사값, 계정 상태에 맞게 조정)
    odsay-daily-quota: 1000           # ODsay Basic(무료)
    kakao-local-daily-quota: 100000
    kakao-directions-daily-quota: 100000
    # Google 과금 단가 (Basic 티어, USD). FieldMask가 Advanced 이상이면 상향 필요
    google-compute-routes-per-request: 0.005
    google-route-matrix-per-element: 0.005
  alert:
    threshold-percent: 20             # 일일 quota 잔여 비율이 이 값(%) 미만이면 Slack 알림
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    daily-summary-cron: "0 0 23 * * *"    # 매일 23:00 오늘 통계 요약 발송
# AWS 크레딧 잔액 Slack 알림. Cost Explorer(us-east-1) 조회 -> 매일 1회 발송.
# AWS는 크레딧 잔액 조회 API를 제공하지 않으므로 부여 총액을 직접 설정해야 잔액이 계산된다.
# 미설정 시 누적 사용액/일평균만 발송한다. https://console.aws.amazon.com/billing/home#/credits
aws:
  cost:
    enabled: ${AWS_COST_ALERT_ENABLED:false}
    access-key: ${AWS_COST_ACCESS_KEY_ID:}
    secret-key: ${AWS_COST_SECRET_ACCESS_KEY:}
    credit-total: ${AWS_CREDIT_TOTAL:}        # 부여받은 크레딧 총액(USD). 예: 300
    credit-start-date: ${AWS_CREDIT_START_DATE:2026-07-01}   # 크레딧 차감 집계 시작일
    cron: "0 0 9 * * *"                       # 매일 09:00 발송 (CE 데이터는 약 24h 지연)

moyeolak:
  rate-limit:
    midpoint-recommendation:
      enabled: true
      meeting-daily-limit: 20
      ip-minute-limit: 5
      ip-daily-limit: 100
