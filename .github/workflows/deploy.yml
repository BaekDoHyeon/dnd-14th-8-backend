name: Deploy to AWS

on:
  push:
    branches:
      - main
      - dev

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: moyeolak-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dockerfile.prod는 COPY만 수행하므로 QEMU 없이 arm64 빌드 가능
      - name: Build and push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Get runner public IP
        id: runner-ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Open SSH port for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ipv4 }}/32

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infra/deploy/docker-compose.prod.yml,infra/deploy/Caddyfile"
          target: /app/moyeolak
          strip_components: 2

      - name: Copy monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "monitoring/"
          target: /app/moyeolak

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /app/moyeolak

            if [ ! -f .env ]; then
              echo "ERROR: /app/moyeolak/.env 파일이 없습니다. 서버에 .env를 생성해주세요."
              exit 1
            fi
            if [ ! -r .env ]; then
              echo "ERROR: /app/moyeolak/.env를 읽을 수 없습니다. (현재: $(ls -l .env))"
              echo "서버에서 'sudo chown ubuntu:ubuntu /app/moyeolak/.env' 실행 후 재시도하세요."
              exit 1
            fi

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}

            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            echo "Deployment completed!"
            docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Close SSH port
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ipv4 }}/32

      # 커밋 메시지 본문(멀티라인)이 Slack 페이로드 YAML을 깨지 않도록 제목만 추출
      - name: Prepare Slack message
        if: always()
        id: slack-prep
        run: echo "commit_title=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && '✅ 배포 성공' || '❌ 배포 실패' }} — moyeolak-backend (${{ github.ref_name }})"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ job.status == 'success' && ':white_check_mark: *배포 성공*' || ':x: *배포 실패*' }} — *moyeolak-backend*\n*브랜치:* `${{ github.ref_name }}`\n*커밋:* ${{ steps.slack-prep.outputs.commit_title }}\n*작성자:* ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 실행 보기>"
