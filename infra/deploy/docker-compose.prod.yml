# EC2 /app/moyeolak/ 에서 실행. 변수는 같은 디렉터리의 .env에서 공급.
# 모니터링 활성화: docker compose -f docker-compose.prod.yml --profile monitoring up -d
services:
  caddy:
    image: caddy:2-alpine
    container_name: moyeolak-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    image: ${ECR_REGISTRY}/moyeolak-backend:latest
    container_name: moyeolak-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAKAO_API_KEY: ${KAKAO_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ODSAY_API_KEY: ${ODSAY_API_KEY}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL}
      TZ: Asia/Seoul
      # 관리자 통계 대시보드 토큰. 서버 /app/moyeolak/.env 에 정의. 미설정 시 /api/admin/** 잠김.
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # Slack 알림용 Incoming Webhook URL. 서버 /app/moyeolak/.env 에 정의. 미설정 시 알림 기능 비활성.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # 2GB 인스턴스에서 힙 폭주 방지
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=Asia/Seoul"
    volumes:
      - ./logs:/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # 공식 postgis/postgis는 amd64 전용이라 arm64(t4g)에서는 imresamu 빌드 사용
    image: imresamu/postgis:15-3.5
    container_name: moyeolak-postgres
    restart: unless-stopped
    ports:
      # 루프백 전용 바인딩: SSH 터널로만 접근 가능, 외부 노출 없음
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 모니터링 (기본 비활성, --profile monitoring) ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  loki:
    image: grafana/loki:latest
    container_name: loki
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  prometheus-data:
  loki-data:
  grafana-data:
